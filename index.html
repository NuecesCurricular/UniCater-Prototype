<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniCater 组织与交易前配置低保真原型</title>
  <link rel="stylesheet" href="assets/workflow-ui.css">
  <style>
    :root {
      --bg: #f4f7f6;
      --surface: #ffffff;
      --surface-muted: #eef3f1;
      --ink: #17201c;
      --muted: #607069;
      --border: #d5ded9;
      --primary: #176b52;
      --primary-dark: #0f513e;
      --primary-soft: #e5f3ed;
      --blue: #175cd3;
      --blue-soft: #eaf2ff;
      --amber: #a84c0f;
      --amber-soft: #fff1e6;
      --red: #b42318;
      --red-soft: #fff0ee;
      --shadow: 0 8px 24px rgba(30, 52, 43, 0.08);
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      grid-template-rows: 58px minmax(0, 1fr);
    }

    .auth-shell {
      min-height: 100vh;
      background: var(--bg);
    }

    .auth-header {
      height: 58px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .auth-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(1120px, calc(100% - 32px));
      height: 100%;
      margin: 0 auto;
    }

    .auth-main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .login-main {
      display: grid;
      min-height: calc(100vh - 58px);
      place-items: center;
      padding-top: 32px;
      padding-bottom: 48px;
    }

    .login-panel {
      width: min(420px, 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .login-panel-header {
      padding: 24px 24px 18px;
      border-bottom: 1px solid var(--border);
    }

    .login-panel-header h1 {
      margin: 0;
      font-size: 22px;
    }

    .login-panel-header p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .login-panel-body {
      display: grid;
      gap: 18px;
      padding: 22px 24px;
    }

    .login-panel-footer {
      display: grid;
      gap: 12px;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--border);
      background: #fbfcfc;
    }

    .login-panel-footer .button {
      width: 100%;
    }

    .login-register {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .text-action {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 700;
    }

    .auth-notice {
      margin-bottom: 18px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      height: 58px;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 5px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
    }

    .brand-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .prototype-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .role-switcher {
      position: relative;
    }

    .role-switch {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid #bfcac5;
      border-radius: 5px;
      background: #fff;
      color: #2e3c36;
      font-weight: 700;
      white-space: nowrap;
    }

    .role-switch:hover,
    .role-switch[aria-expanded="true"] {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .role-switch svg,
    .role-option svg {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      stroke-width: 1.8;
    }

    .role-prefix {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .role-menu {
      position: absolute;
      z-index: 70;
      top: 46px;
      right: 0;
      width: 278px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .role-option {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 18px;
      gap: 9px;
      align-items: center;
      width: 100%;
      min-height: 54px;
      padding: 8px 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .role-option:hover {
      border-color: var(--border);
      background: var(--surface-muted);
    }

    .role-option.active {
      border-color: #b7d7ca;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .role-option-title {
      display: block;
      font-weight: 700;
    }

    .role-option-copy {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .role-option-check {
      color: var(--primary);
    }

    .sidebar {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: #fbfcfc;
      padding: 20px 14px;
    }

    .nav-label {
      margin: 0 10px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      margin-bottom: 24px;
    }

    .nav-section-label {
      margin: 14px 10px 4px;
      color: #718078;
      font-size: 11px;
      font-weight: 750;
    }

    .nav-section-label:first-child {
      margin-top: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: #33433c;
      text-align: left;
    }

    .nav-item:hover {
      border-color: var(--border);
      background: var(--surface);
    }

    .nav-item.active {
      border-color: #b7d7ca;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .nav-item svg,
    .button svg,
    .icon-button svg,
    .notice svg {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      stroke-width: 1.8;
    }

    .sidebar-note {
      margin: 8px 10px 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .main {
      min-width: 0;
      padding: 26px;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .page-subtitle {
      max-width: 760px;
      margin: 7px 0 0;
      color: var(--muted);
    }

    .screen-id {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .workspace {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
    }

    .workspace-title {
      margin: 0;
      font-size: 16px;
    }

    .workspace-body {
      padding: 22px;
    }

    .workspace-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 62px;
      padding: 11px 18px;
      border-top: 1px solid var(--border);
      background: #fbfcfc;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .step {
      position: relative;
      min-width: 0;
      padding: 11px 10px;
      border-right: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .step:last-child {
      border-right: 0;
    }

    .step.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .step.done {
      color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #2f3e38;
      font-weight: 600;
    }

    .required {
      color: var(--red);
    }

    .field-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid #bfcac5;
      border-radius: 5px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    .textarea {
      min-height: 92px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 107, 82, 0.12);
    }

    .input[readonly] {
      background: var(--surface-muted);
      color: var(--muted);
    }

    .inline-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 5px;
      font-weight: 650;
      white-space: nowrap;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.primary:hover {
      background: var(--primary-dark);
    }

    .button.secondary {
      border-color: #bfcac5;
      background: #fff;
      color: #2e3c36;
    }

    .button.secondary:hover {
      background: var(--surface-muted);
    }

    .button.danger {
      border-color: #e6b5af;
      background: #fff;
      color: var(--red);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: #43534c;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 12px;
      min-height: 94px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      text-align: left;
    }

    .choice:hover {
      border-color: #8fbbaa;
    }

    .choice.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .choice-radio {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border: 2px solid #95a39d;
      border-radius: 50%;
      background: #fff;
    }

    .choice.selected .choice-radio {
      border: 5px solid var(--primary);
    }

    .choice-title {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .choice-copy {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid #bbd0c7;
      border-radius: var(--radius);
      background: var(--surface-muted);
      color: #33433c;
    }

    .notice.warning {
      border-color: #e9c29e;
      background: var(--amber-soft);
      color: #713b14;
    }

    .notice.error {
      border-color: #eab8b3;
      background: var(--red-soft);
      color: #7a271f;
    }

    .notice.info {
      border-color: #b9cff4;
      background: var(--blue-soft);
      color: #184991;
    }

    .notice.success {
      border-color: #b7d7ca;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .upload-list {
      display: grid;
      gap: 12px;
    }

    .upload-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .upload-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 5px;
      background: var(--surface-muted);
      color: var(--primary);
    }

    .upload-icon svg {
      width: 20px;
      height: 20px;
    }

    .upload-title {
      font-weight: 700;
    }

    .upload-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-list {
      display: grid;
      gap: 0;
      margin: 0;
      border-top: 1px solid var(--border);
    }

    .summary-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-label {
      color: var(--muted);
    }

    .summary-value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.pending {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status.approved,
    .status.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .status.returned,
    .status.suspended {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status.disabled {
      background: #edf0ef;
      color: #5f6f68;
    }

    .progress-panel {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .progress-visual {
      display: grid;
      width: 140px;
      height: 140px;
      place-items: center;
      border: 10px solid var(--primary-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      color: var(--primary-dark);
      font-weight: 800;
      text-align: center;
    }

    .timeline {
      display: grid;
      gap: 0;
      margin-top: 18px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 10px;
      min-height: 54px;
    }

    .timeline-track {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .timeline-track::after {
      position: absolute;
      top: 14px;
      bottom: -2px;
      width: 1px;
      background: var(--border);
      content: "";
    }

    .timeline-item:last-child .timeline-track::after {
      display: none;
    }

    .timeline-dot {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .timeline-title {
      font-weight: 700;
    }

    .timeline-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .toolbar .input,
    .toolbar .select {
      width: auto;
      min-width: 160px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      text-align: left;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background: #f7f9f8;
      color: #50615a;
      font-size: 12px;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .table-action {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 700;
    }

    .table-action.danger {
      color: var(--red);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .management-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 560px;
    }

    .management-tree {
      min-width: 0;
      border-right: 1px solid var(--border);
      background: #fbfcfc;
    }

    .management-tree-header,
    .management-content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .management-tree-body {
      padding: 12px;
    }

    .management-content {
      min-width: 0;
    }

    .management-content-body {
      padding: 16px;
    }

    .tree-list {
      display: grid;
      gap: 4px;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #33433c;
      text-align: left;
    }

    .tree-node:hover {
      border-color: var(--border);
      background: #fff;
    }

    .tree-node.active {
      border-color: #b7d7ca;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .tree-node.depth-1 {
      padding-left: 28px;
    }

    .tree-node.depth-2 {
      padding-left: 48px;
    }

    .own-product-icon {
      display: inline-flex;
      margin-left: 4px;
      color: #8b9993;
      vertical-align: -2px;
    }

    .own-product-icon svg {
      width: 14px;
      height: 14px;
    }

    .money-input {
      display: grid;
      grid-template-columns: 26px minmax(92px, 1fr);
      align-items: center;
      min-width: 132px;
      border: 1px solid #bfcac5;
      border-radius: 5px;
      background: #fff;
      overflow: hidden;
    }

    .money-input span {
      color: var(--muted);
      text-align: right;
    }

    .money-input .input {
      min-height: 38px;
      border: 0;
      box-shadow: none;
    }

    .money-input .inherited-price {
      color: #98a39e;
    }

    .selection-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .selection-side {
      padding: 14px;
      border-right: 1px solid var(--border);
      background: #fbfcfc;
    }

    .selection-main {
      min-width: 0;
      padding: 14px;
    }

    .category-checks {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .tree-node.depth-3 {
      padding-left: 68px;
    }

    .tree-node.depth-4 {
      padding-left: 88px;
    }

    .tree-node svg,
    .tree-actions svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
    }

    .tree-actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .tree-actions .icon-button {
      width: 100%;
    }

    .permission-groups {
      display: grid;
      gap: 12px;
    }

    .permission-group {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .permission-group-title {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .permission-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .role-management-layout {
      grid-template-columns: 260px minmax(0, 1fr);
    }

    .role-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .role-list-item {
      display: grid;
      gap: 5px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .role-list-item:hover {
      border-color: var(--border);
      background: #fff;
    }

    .role-list-item.active {
      border-color: #b7d7ca;
      background: var(--primary-soft);
    }

    .role-list-name {
      font-weight: 750;
    }

    .role-list-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .role-editor-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .role-editor-tabs {
      margin: 0;
      padding: 0 16px;
    }

    .permission-toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 420px) auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .permission-module {
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
    }

    .permission-module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfc;
    }

    .permission-module-header strong {
      font-size: 14px;
    }

    .permission-matrix th:not(:first-child),
    .permission-matrix td:not(:first-child) {
      width: 68px;
      text-align: center;
    }

    .permission-matrix input {
      width: 16px;
      height: 16px;
    }

    .permission-name {
      min-width: 132px;
      font-weight: 650;
    }

    .scope-options {
      display: grid;
      gap: 10px;
      max-width: 680px;
    }

    .role-members-note {
      margin-bottom: 14px;
    }

    .check-option,
    .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #33433c;
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .radio-card {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 74px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
    }

    .radio-card strong,
    .radio-card span {
      display: block;
    }

    .radio-card span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .split-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .review-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.7fr);
      gap: 20px;
      align-items: start;
    }

    .review-section {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .review-section:first-child {
      padding-top: 0;
    }

    .review-section:last-child {
      border-bottom: 0;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .definition-grid {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 10px 14px;
      margin: 0;
    }

    .definition-grid dt {
      color: var(--muted);
    }

    .definition-grid dd {
      margin: 0;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .side-panel {
      position: sticky;
      top: 84px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fbfcfc;
      padding: 16px;
    }

    .side-panel .button {
      width: 100%;
      margin-top: 10px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric {
      min-height: 106px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-value {
      margin-top: 8px;
      font-size: 27px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      min-height: 40px;
      padding: 8px 13px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 650;
    }

    .tab.active {
      border-bottom-color: var(--primary);
      color: var(--primary-dark);
    }

    .master-tabs {
      max-width: 100%;
      overflow-x: auto;
      white-space: nowrap;
    }

    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .scenario {
      min-height: 208px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .scenario h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .scenario p {
      min-height: 64px;
      margin: 0 0 14px;
      color: var(--muted);
    }

    .scenario .button {
      width: 100%;
    }

    .catalog-product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .catalog-product-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .catalog-product-card.selected {
      border-color: #8fbbaa;
      box-shadow: inset 0 0 0 1px #8fbbaa;
    }

    .product-photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: var(--surface-muted);
      background-image: url("assets/procurement-food-products-v0.1.png");
      background-position: 0 0;
      background-size: 300% 200%;
    }

    .sprite-0 { background-position: 0 0; }
    .sprite-1 { background-position: 50% 0; }
    .sprite-2 { background-position: 100% 0; }
    .sprite-3 { background-position: 0 100%; }
    .sprite-4 { background-position: 50% 100%; }
    .sprite-5 { background-position: 100% 100%; }

    .product-content {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .product-title-row,
    .product-price-row,
    .demand-summary-bar,
    .order-row-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .product-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 750;
    }

    .product-meta,
    .supplier-note,
    .allocation-list {
      color: var(--muted);
      font-size: 12px;
    }

    .supplier-offer-select {
      display: grid;
      gap: 5px;
    }

    .supplier-offer-select label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .supplier-offer-select .select {
      min-height: 36px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .product-price {
      color: var(--red);
      font-size: 16px;
      font-weight: 800;
    }

    .quantity-control {
      display: grid;
      grid-template-columns: 34px 64px 34px;
      width: 132px;
      height: 34px;
      border: 1px solid #bfcac5;
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .quantity-control button {
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: #f7f9f8;
      color: #3a4a43;
    }

    .quantity-control button:first-child {
      border-right: 1px solid var(--border);
    }

    .quantity-control button:last-child {
      border-left: 1px solid var(--border);
    }

    .quantity-control svg {
      width: 15px;
      height: 15px;
    }

    .quantity-control input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      text-align: center;
    }

    .demand-summary-bar {
      flex-wrap: wrap;
      width: 100%;
    }

    .summary-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }

    .summary-metrics strong {
      margin-left: 4px;
      font-size: 16px;
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .review-category-group {
      margin-bottom: 18px;
    }

    .review-category-group:last-child {
      margin-bottom: 0;
    }

    .review-category-title {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .review-decision {
      display: grid;
      gap: 6px;
      min-width: 176px;
    }

    .review-decision .select,
    .review-decision .input {
      min-height: 34px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .conversion-overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .conversion-metric {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fbfcfc;
    }

    .conversion-metric strong {
      display: block;
      margin-top: 4px;
      font-size: 19px;
    }

    .order-parent-row td {
      background: #f7f9f8;
      font-weight: 650;
    }

    .order-child-row td:first-child {
      padding-left: 38px;
    }

    .order-allocation-row td {
      background: #fbfcfc;
      color: var(--muted);
      font-size: 12px;
    }

    .order-allocation-row td:first-child {
      padding-left: 44px;
    }

    .order-product-name,
    .allocation-detail {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .allocation-detail svg {
      width: 14px;
      height: 14px;
    }

    .allocation-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 700;
    }

    .allocation-toggle svg {
      width: 15px;
      height: 15px;
    }

    .order-code {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .order-code svg {
      width: 16px;
      height: 16px;
    }

    .order-detail-tabs {
      margin: 0;
      padding: 0 18px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .approval-flow {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fbfcfc;
    }

    .approval-node {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 190px;
    }

    .approval-node strong,
    .approval-node span:not(.approval-dot) {
      display: block;
    }

    .approval-node span:not(.approval-dot) {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .approval-node.pending {
      color: #7b8781;
    }

    .approval-dot {
      display: inline-grid;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #e8ecea;
      color: #77827d;
    }

    .approval-node.done .approval-dot {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .approval-dot svg {
      width: 15px;
      height: 15px;
    }

    .approval-line {
      width: 40px;
      height: 1px;
      flex: 0 0 auto;
      align-self: center;
      background: #cfd7d3;
    }

    .approval-line.done {
      background: var(--primary);
    }

    .delivery-document-zone {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px dashed #aebbb5;
      border-radius: 5px;
      background: #fbfcfc;
    }

    .delivery-document-zone svg {
      width: 22px;
      height: 22px;
      color: var(--primary);
    }

    .print-sheet {
      padding: 16px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .print-sheet + .print-sheet {
      margin-top: 12px;
    }

    .print-sheet h3 {
      margin: 0 0 12px;
      text-align: center;
    }

    .print-sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #29352f;
    }

    .print-sheet-header h3 {
      margin: 0;
      text-align: left;
    }

    .print-sheet-number {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .print-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 18px;
      margin: 14px 0;
      font-size: 12px;
    }

    .print-sheet .table-wrap {
      overflow: visible;
    }

    .delivery-note-table {
      table-layout: fixed;
    }

    .delivery-note-table th,
    .delivery-note-table td {
      padding: 8px 6px;
      font-size: 11px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
    }

    .delivery-note-table.full th:nth-child(1) { width: 14%; }
    .delivery-note-table.full th:nth-child(2) { width: 14%; }
    .delivery-note-table.full th:nth-child(3) { width: 16%; }
    .delivery-note-table.full th:nth-child(4) { width: 26%; }
    .delivery-note-table.full th:nth-child(5) { width: 10%; }
    .delivery-note-table.full th:nth-child(6) { width: 10%; }
    .delivery-note-table.full th:nth-child(7) { width: 10%; }

    .print-note-box {
      min-height: 48px;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .signature-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .signature-cell {
      min-height: 54px;
      padding-top: 30px;
      border-bottom: 1px solid #6b7771;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .product-label-sheet {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 14px;
      width: min(520px, 100%);
      margin: 0 auto;
      padding: 14px;
      border: 2px solid #29352f;
      background: #fff;
    }

    .product-label-title {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .product-label-data {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 12px;
    }

    .product-label-data span:nth-child(odd) {
      color: var(--muted);
    }

    .trace-qr-placeholder {
      display: grid;
      width: 112px;
      height: 112px;
      place-items: center;
      border: 1px solid #29352f;
      background: #f8faf9;
      color: #29352f;
      text-align: center;
      font-size: 10px;
    }

    .trace-qr-placeholder svg {
      width: 62px;
      height: 62px;
      stroke-width: 1.4;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(18, 31, 25, 0.42);
    }

    .modal {
      width: min(480px, 100%);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 18px 50px rgba(18, 31, 25, 0.24);
    }

    .modal.wide {
      width: min(760px, 100%);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }

    .hidden {
      display: none !important;
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .topbar {
        grid-column: 1;
      }

      .mobile-menu {
        display: inline-grid;
      }

      .sidebar {
        position: fixed;
        z-index: 40;
        top: 58px;
        left: 0;
        width: min(280px, 86vw);
        transform: translateX(-100%);
        transition: transform 160ms ease;
        box-shadow: var(--shadow);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        padding: 20px 16px;
      }

      .review-layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        position: static;
      }

      .management-layout {
        grid-template-columns: 1fr;
      }

      .management-tree {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .selection-layout {
        grid-template-columns: 1fr;
      }

      .selection-side {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }

    @media (max-width: 680px) {
      .auth-main {
        width: min(100% - 24px, 960px);
        padding: 22px 0 36px;
      }

      .login-main {
        padding-top: 20px;
      }

      .auth-header-inner {
        width: calc(100% - 24px);
      }

      .auth-header .brand-name {
        display: inline;
      }

      .auth-header .role-switch {
        max-width: 154px;
      }

      .topbar {
        gap: 8px;
        padding: 0 12px;
      }

      .brand {
        gap: 8px;
      }

      .brand-name {
        display: none;
      }

      .prototype-label {
        display: none;
      }

      .topbar-actions {
        gap: 5px;
      }

      .role-switch {
        max-width: 128px;
        padding: 7px;
      }

      .role-prefix {
        display: none;
      }

      .role-menu {
        position: fixed;
        top: 56px;
        right: 12px;
        left: 12px;
        width: auto;
        max-height: calc(100vh - 68px);
        overflow-y: auto;
      }

      .page-header {
        display: block;
      }

      .screen-id {
        display: inline-block;
        margin-top: 10px;
      }

      .stepper {
        grid-template-columns: 1fr;
      }

      .step {
        display: none;
        border-right: 0;
      }

      .step.active {
        display: block;
      }

      .form-grid,
      .choice-grid,
      .metric-grid,
      .scenario-grid,
      .progress-panel {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .progress-visual {
        width: 112px;
        height: 112px;
        justify-self: center;
      }

      .workspace-body {
        padding: 16px;
      }

      .workspace-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .footer-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-left: 0;
      }

      .summary-row {
        grid-template-columns: 100px minmax(0, 1fr);
      }

      .summary-row .table-action {
        grid-column: 2;
        justify-self: start;
        padding: 0;
      }

      .toolbar .input,
      .toolbar .select {
        width: 100%;
      }

      .choice-row {
        grid-template-columns: 1fr;
      }

      .permission-toolbar {
        grid-template-columns: 1fr;
      }

      .role-editor-tabs {
        overflow-x: auto;
      }

      .permission-matrix th:not(:first-child),
      .permission-matrix td:not(:first-child) {
        width: 56px;
      }

      .management-content-header {
        align-items: flex-start;

    function maskCode(code) {
      if (!code || code.length < 8) return code;
      return `${code.slice(0, 5)}******${code.slice(-4)}`;

      const returned = state.applicationStatus === "returned";
      const approved = state.applicationStatus === "approved";
      const statusLabel = returned ? "已退回" : approved ? "已通过" : "待审核";

    function demandOffer(product) {
      const offers = Object.entries(product.supplierPrices).sort((left, right) => left[1] - right[1]);
      const selectedSupplier = state.demandSupplierChoices[product.id];
      const selectedOffer = offers.find(([supplier]) => supplier === selectedSupplier) || offers[0];
      if (offers.length > 1 && state.demandSupplierChoices[product.id] !== selectedOffer[0]) {
        state.demandSupplierChoices[product.id] = selectedOffer[0];
      }
      return { supplier: selectedOffer[0], price: selectedOffer[1], offers };
    }

    function demandTotals() {
      return selectedDemandProducts().reduce((totals, product) => {
        const quantity = Number(state.demandQuantities[product.id] || 0);
        totals.amount += quantity * demandOffer(product).price;
        totals.weight += quantity * product.weightFactor;
        totals.lines += 1;
        return totals;
      }, { amount: 0, weight: 0, lines: 0 });
    }

        render();
        return;
      }

      const actionTarget = event.target.closest("[data-action]");
      if (!actionTarget) return;
      const action = actionTarget.dataset.action;

      if (action === "select-role") {
        state.selectedRole = actionTarget.dataset.roleName;
        state.roleSaved = false;
        render();
        return;
      }

      if (action === "open-registration") {
        state.surface = "registration";
        state.applyStep = 0;

        window.scrollTo({ top: 0 });

        const loginPhone = document.getElementById("login-phone").value.trim();
        const normalizedPhone = loginPhone.replace(/\s/g, "");
        const matchedPlatformAdmin = platformOrganizationRows().map(([, organization]) => organization)
          .find((organization) => organization.adminPhone.replace(/\s/g, "") === normalizedPhone);
        if (matchedPlatformAdmin?.accountStatus === "disabled") {
          state.loginNotice = `账号已停用，停用原因：${matchedPlatformAdmin.stopReason || "平台管理员停用"}`;
          render();
          return;
        }
        if (normalizedPhone === "19900000001") {
          enterPlatform("platform");
          return;
        }
        state.phone = loginPhone;
        if (state.applicationStatus === "approved") {
          enterPlatform(participantForOrganization());
          return;
        }
        if (state.applicationStatus === "pending" || state.applicationStatus === "returned") {
          state.surface = "status";
          state.loginNotice = "";
          window.scrollTo({ top: 0 });
          render();
          return;
        }
        state.loginNotice = "未找到该手机号对应的平台账号或注册申请。";
        render();

        closeModal();
        state.rfqCreated = true;
        navigate("school-rfqs");
      }

      if (action === "submit-rfq-response") {
        showModal({
          title: state.supplierRfqSubmitted ? "修改报价" : "提交报价",
          body: `<div class="notice info" style="margin-top:0;">${icon("clock")}<div>报价截止：2026-08-16 18:00。截止前可以修改或撤销；提交时将固化所选价格单快照。</div></div><dl class="definition-grid"><dt>报价邀约</dt><dd>2026年8月第2次报价邀约</dd><dt>学校</dt><dd>山东城市大学</dd><dt>可报名品类</dt><dd>蔬菜、水果</dd><dt>价格有效期</dt><dd>2026-08-17 至 2026-08-23</dd></dl><div class="field" style="margin-top:16px;"><label>选择已保存价格单 <span class="required">*</span></label><div class="table-wrap"><table><thead><tr><th>选择</th><th>价格单名称</th><th>可供商品</th><th>最后维护时间</th></tr></thead><tbody><tr><td><input type="radio" name="rfq-price-sheet" checked aria-label="选择A级价格"></td><td><strong>A 级价格</strong></td><td>66 / 68</td><td>${state.priceBookSaved ? "2026-08-13 15:20" : "2026-08-12 09:10"}</td></tr><tr><td><input type="radio" name="rfq-price-sheet" aria-label="选择学校基础价格"></td><td><strong>学校基础价格</strong></td><td>72 / 72</td><td>2026-08-10 16:45</td></tr><tr><td><input type="radio" name="rfq-price-sheet" aria-label="选择批量采购价格"></td><td><strong>批量采购价格</strong></td><td>38 / 42</td><td>2026-08-06 11:32</td></tr></tbody></table></div></div>`,
          confirmLabel: state.supplierRfqSubmitted ? "保存修改" : "提交报价",
          confirmAction: "confirm-submit-rfq-response",
          wide: true
        });
      }

      if (action === "confirm-submit-rfq-response") {
        closeModal();
        state.supplierRfqSubmitted = true;
        navigate("supplier-rfqs");
      }

      if (action === "revoke-rfq-response") {
        showModal({title: "撤销已提交报价", body: `<div class="notice warning" style="margin-top:0;">${icon("triangle-alert")}<div>撤销后学校将不再看到当前报价快照。截止前仍可重新提交。</div></div><div class="field"><label for="revoke-reason">撤销原因</label><textarea class="textarea" id="revoke-reason">价格单需要重新核对。</textarea></div>`, confirmLabel: "确认撤销", confirmAction: "confirm-revoke-rfq-response", danger: true});
      }

      if (action === "confirm-revoke-rfq-response") {
        closeModal();
        state.supplierRfqSubmitted = false;
        navigate("supplier-rfqs");
      }

      if (action === "confirm-rfq-award") {
        showModal({
          title: "按品类确认报价",
          body: `<div class="notice info" style="margin-top:0;">${icon("badge-check")}<div><strong>每个品类必须选择 1 家供应商。</strong><br>选择结果形成该品类在本价格周期内唯一的采购价格来源；价格明细请在“查看报价”中比较。</div></div><dl class="definition-grid"><dt>报价邀约</dt><dd>2026年8月第1次报价邀约</dd><dt>报价响应</dt><dd>5 / 5 家已提交</dd><dt>价格有效期</dt><dd>2026-08-10 至 2026-08-16</dd></dl><div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th>品类</th><th>选择</th><th>供应商</th><th>商品覆盖</th><th>响应时间</th></tr></thead><tbody><tr><td rowspan="3"><strong>蔬菜</strong></td><td><input type="radio" name="award-vegetable" aria-label="选择泉城鲜蔬蔬菜报价"></td><td>泉城鲜蔬配送中心</td><td>4 / 4</td><td>08-09 16:20</td></tr><tr><td><input type="radio" name="award-vegetable" checked aria-label="选择绿源生鲜蔬菜报价"></td><td>绿源生鲜商贸</td><td><span class="status returned">3 / 4</span></td><td>08-09 17:05</td></tr><tr><td><input type="radio" name="award-vegetable" aria-label="选择齐鲁农产蔬菜报价"></td><td>齐鲁农产配送</td><td>4 / 4</td><td>08-09 15:48</td></tr><tr><td rowspan="2"><strong>水果</strong></td><td><input type="radio" name="award-fruit" checked aria-label="选择四季果业水果报价"></td><td>四季果业</td><td>2 / 2</td><td>08-09 14:36</td></tr><tr><td><input type="radio" name="award-fruit" aria-label="选择泉城鲜蔬水果报价"></td><td>泉城鲜蔬配送中心</td><td>2 / 2</td><td>08-09 16:20</td></tr></tbody></table></div>`,
          confirmLabel: "下一步",
          confirmAction: "check-rfq-unavailable-products",
          wide: true
        });
      }

      if (action === "check-rfq-unavailable-products") {
        showModal({
          title: "无法供应商品二次确认",
          body: `<div class="notice warning" style="margin-top:0;">${icon("triangle-alert")}<div>已选择的“绿源生鲜商贸”无法供应 1 个蔬菜商品。此项不会进入该供应商的有效可采购目录，请确认后再生效报价结果。</div></div><div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th>品类</th><th>商品</th><th>已选供应商</th><th>处理方式</th></tr></thead><tbody><tr><td>蔬菜</td><td><strong>鲜香菇</strong><br><span class="field-hint">一级 · 散装称重</span></td><td>绿源生鲜商贸</td><td><select class="select"><option>本轮不纳入供货范围</option><option>改选覆盖该商品的供应商</option><option>转临时采购处理</option></select></td></tr></tbody></table></div><div class="field" style="margin-top:16px;"><label class="check-option"><input type="checkbox" checked> 我已确认上述商品无法由本轮已选供应商供货</label></div>`,
          confirmLabel: "确认并生效",
          confirmAction: "confirm-rfq-award-done",
          danger: true,
          wide: true
        });
      }

      if (action === "confirm-rfq-award-done") {
        closeModal();
        state.rfqAccepted = true;
        state.rfqUnavailableConfirmed = true;
        navigate("school-rfqs");
      }

      if (action === "view-rfq") {
        showModal({title: "报价明细对比", body: `<dl class="definition-grid"><dt>邀约名称</dt><dd>2026年8月第2次报价邀约</dd><dt>品类</dt><dd>蔬菜、水果</dd><dt>提交进度</dt><dd>${state.supplierRfqSubmitted ? "4 / 4" : "3 / 4"}</dd><dt>价格有效期</dt><dd>2026-08-17 至 2026-08-23</dd></dl><div class="notice info" style="margin:16px 0 0;">${icon("circle-dollar-sign")}<div>以下是已提交报价的商品价格快照。<strong>最低价</strong>仅用于辅助比较，不自动决定中选供应商。</div></div><h3 class="section-title" style="margin-top:18px;">蔬菜</h3><div class="table-wrap"><table><thead><tr><th>商品</th><th>规格 / 单位</th><th>泉城鲜蔬</th><th>绿源生鲜</th><th>齐鲁农产</th></tr></thead><tbody><tr><td><strong>一级土豆</strong></td><td>散装称重 / kg</td><td>¥2.480</td><td><strong>¥2.420</strong> <span class="status active">最低价</span></td><td>¥2.510</td></tr><tr><td><strong>精选大白菜</strong></td><td>散装称重 / kg</td><td>¥2.350</td><td><strong>¥2.290</strong> <span class="status active">最低价</span></td><td>¥2.380</td></tr><tr><td><strong>精品西红柿</strong></td><td>散装称重 / kg</td><td>¥4.860</td><td><strong>¥4.720</strong> <span class="status active">最低价</span></td><td>¥4.800</td></tr><tr><td><strong>鲜香菇</strong></td><td>散装称重 / kg</td><td>¥8.600</td><td><span class="status disabled">无法供应</span></td><td><strong>¥8.450</strong> <span class="status active">最低价</span></td></tr></tbody></table></div><h3 class="section-title" style="margin-top:18px;">水果</h3><div class="table-wrap"><table><thead><tr><th>商品</th><th>规格 / 单位</th><th>泉城鲜蔬</th><th>四季果业</th></tr></thead><tbody><tr><td><strong>红富士苹果</strong></td><td>80-85mm / kg</td><td>¥6.350</td><td><strong>¥6.200</strong> <span class="status active">最低价</span></td></tr><tr><td><strong>香蕉</strong></td><td>一级 / kg</td><td>¥4.800</td><td><strong>¥4.700</strong> <span class="status active">最低价</span></td></tr></tbody></table></div>`, confirmLabel: "知道了", wide: true});
      }

      if (action === "view-rfq-result") {
        showModal({title: "报价确认结果", body: `<dl class="definition-grid"><dt>邀约名称</dt><dd>2026年8月第1次报价邀约</dd><dt>状态</dt><dd><span class="status active">已接受报价</span></dd><dt>价格有效期</dt><dd>2026-08-10 至 2026-08-16</dd></dl><div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th>品类</th><th>已选供应商</th><th>商品覆盖</th><th>结果</th></tr></thead><tbody><tr><td>蔬菜</td><td>绿源生鲜商贸</td><td>3 / 4 种商品${state.rfqUnavailableConfirmed ? " · 已二次确认" : ""}</td><td><span class="status active">已生效</span></td></tr><tr><td>水果</td><td>四季果业</td><td>2 / 2 种商品</td><td><span class="status active">已生效</span></td></tr></tbody></table></div>`, confirmLabel: "知道了", wide: true});
      }

      if (action === "supplier-qualification" || action === "review-supplier") {
        showModal({title: action === "review-supplier" ? "审核供应商入驻" : "管理供货资格", body: `<div class="form-grid"><div class="field"><label>供货品类</label><select class="select"><option>蔬菜、水果</option><option>冻品、水产</option></select></div><div class="field"><label>报价周期</label><select class="select"><option>每周</option><option>半月</option><option>每月</option></select></div><div class="field"><label>服务范围</label><select class="select"><option>主校区全部食堂</option><option>A 食堂、B 食堂</option></select></div><div class="field"><label>校内负责人</label><select class="select"><option>陈晨 · 采购管理科</option><option>刘志刚 · 后勤处</option></select></div><div class="field"><label>开始日期</label><input class="input" type="date" value="2026-08-05"></div><div class="field"><label>结束日期</label><input class="input" type="date" value="2027-08-04"></div></div>`, confirmLabel: action === "review-supplier" ? "通过并建立资格" : "保存资格", confirmAction: "close-modal"});
      }

      if (action === "apply-cooperation") {
        showModal({title: "申请合作", body: `<div class="notice info">${icon("shield-check")}<div>机构申请码只用于定位目标机构；提交前必须验证当前组织管理员手机号。</div></div><div class="field"><label for="cooperation-code">机构申请码 <span class="required">*</span></label><input class="input" id="cooperation-code" value="SDCU-2026"></div><div class="field" style="margin-top:14px;"><label>管理员手机号</label><input class="input" value="${state.phone}" readonly></div><div class="field" style="margin-top:14px;"><label>短信验证码 <span class="required">*</span></label><div class="inline-field"><input class="input" value="246810"><button class="button secondary" type="button" data-action="send-code">${icon("message-square")}<span>获取验证码</span></button></div></div><div class="field" style="margin-top:14px;"><label>合作说明</label><textarea class="textarea">申请入驻并建立业务合作关系。</textarea></div>`, confirmLabel: "验证并提交申请", confirmAction: "confirm-cooperation"});
      }

      if (action === "confirm-cooperation") {
        closeModal();
        state.cooperationApplied = true;
        navigate("cooperations");
      }

      if (action === "assign-owner") {
        showModal({title: "选择合作负责人", body: `<div class="field"><label>合作机构</label><input class="input" value="山东城市大学" readonly></div><div class="field" style="margin-top:14px;"><label>本组织负责人 <span class="required">*</span></label><select class="select"><option>${state.participant === "supplier" ? "张杰 · 销售负责人" : "陈洁 · 运营经理"}</option><option>${state.contact} · 组织管理员</option></select></div><div class="notice info" style="margin:14px 0 0;">${icon("info")}<div>负责人获得该合作机构的数据范围，不改变所属部门和组织。</div></div>`, confirmLabel: "保存负责人", confirmAction: "close-modal"});
      }

      if (action === "stop-member") {
        showModal({
          title: "停用陈洁",
          body: `
            <div class="notice warning">
              ${icon("list-todo")}
              <div>陈洁还有 3 个未完成待办。停用前必须转交给同组织且拥有相应项目权限的人员。</div>
            </div>
            <div class="field">
              <label for="handover">待办接收人 <span class="required">*</span></label>
              <select class="select" id="handover">
                <option>王芳 · 运营部 · 已分配相同项目</option>
                <option>李明 · 组织管理员</option>
              </select>
            </div>
          `,
          confirmLabel: "转交并停用",
          confirmAction: "confirm-stop-member",
          danger: true
        });
      }

      if (action === "confirm-stop-member") {
        closeModal();
        showModal({
          title: "人员已停用",
          body: `<p style="margin:0;">3 个待办已转交给王芳。陈洁不能继续登录，历史单据和签署快照保持不变。</p>`,
          confirmLabel: "知道了"
        });
      }

      if (action === "show-duplicate") {
        showModal({
          title: "该主体已经存在",
          body: `
            <div class="notice error" style="margin:0;">
              ${icon("copy-x")}
              <div><strong>无法重复注册</strong><br>该统一社会信用代码已在平台登记。你可以发起加入已有组织申请，平台核实后联系该组织管理员处理。</div>
            </div>
          `,
          confirmLabel: "发起加入申请",
          confirmAction: "close-modal"
        });
      }

      if (action === "show-suspended") {
        state.orgSuspended = true;
        navigate("org-dashboard");
      }

      if (["close-modal", "preview-file", "edit-contact", "invite-supplier",
        "resend-invite"].includes(action)) {
        if (action === "close-modal") closeModal();
        if (action !== "close-modal") {
          showModal({
            title: "原型操作说明",
            body: `<p style="margin:0;">该入口已纳入详细需求，本轮低保真原型重点验证主流程和关键异常，不继续展开次级表单。</p>`,
            confirmLabel: "知道了"
          });
        }
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[name="stop-mode"]')) {
        const scheduledStopField = document.getElementById("scheduled-stop-field");
        if (scheduledStopField) scheduledStopField.classList.toggle("hidden", event.target.value !== "scheduled");
      }
      if (event.target.matches("[data-demand-quantity]")) {
        state.demandQuantities[event.target.dataset.demandQuantity] = Math.max(0, Number(event.target.value || 0));
        render();
      }
      if (event.target.matches("[data-demand-supplier]")) {
        state.demandSupplierChoices[event.target.dataset.demandSupplier] = event.target.value;
        render();
      }
      if (event.target.matches("[data-review-decision]")) {
        state.reviewDecisions[event.target.dataset.reviewDecision] = event.target.value;
        render();
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.classList.contains("inherited-price")) {
        event.target.classList.remove("inherited-price");
      }
      if (event.target.matches("[data-demand-quantity]")) {
        state.demandQuantities[event.target.dataset.demandQuantity] = Math.max(0, Number(event.target.value || 0));
      }
      if (event.target.matches("[data-review-note]")) {
        state.reviewNotes[event.target.dataset.reviewNote] = event.target.value;
      }
    });

    const workflowNav = [
      ["school-catalog", "list-tree", "采购目录"],
      ["demand-plans", "clipboard-list", "周期采购清单"],
      ["sku-match", "git-compare-arrows", "SKU 对应"],
      ["receipts", "package-check", "验收入库"],
      ["business-exceptions", "file-plus-2", "新单与冲销"],
      ["settlements", "receipt-text", "对账结算"],
      ["workflow-tasks", "bell", "待办与提醒"],
      ["workflow-settings", "settings", "业务设置"]
    ];
    for (const nav of [schoolAdminNav, schoolProcurementNav]) {
      const quoteIndex = nav.findIndex(n => n[0] === "school-rfqs");
      nav.splice(quoteIndex < 0 ? nav.length : quoteIndex, 0, ...workflowNav.filter(n => ["school-catalog", "demand-plans", "sku-match"].includes(n[0])));
      const issueIndex = nav.findIndex(n => n[0] === "issues");
      nav.splice(issueIndex < 0 ? nav.length : issueIndex + 1, 0, workflowNav.find(n => n[0] === "receipts"));
      nav.push(["", "", "对账与待办", "section"], ...workflowNav.filter(n => ["business-exceptions", "settlements", "workflow-tasks"].includes(n[0])));
    }
    schoolAdminNav.push(workflowNav.find(n => n[0] === "workflow-settings"));
    externalAdminNav.push(...workflowNav.filter(n => ["demand-plans", "business-exceptions", "settlements", "workflow-tasks"].includes(n[0])));
    cateringProcurementNav.push(...workflowNav.filter(n => ["demand-plans", "business-exceptions", "settlements"].includes(n[0])));
    supplierAdminNav.push(...workflowNav.filter(n => ["demand-plans", "sku-match", "business-exceptions", "settlements"].includes(n[0])));
    supplierSalesNav.push(...workflowNav.filter(n => ["demand-plans", "sku-match"].includes(n[0])));
    participantDefinitions.school.jobs["school-warehouse"].nav.push(...workflowNav.filter(n => ["receipts", "business-exceptions", "workflow-tasks"].includes(n[0])));
    for (const kind of ["school", "supplier", "catering"]) {
      const financial = participantDefinitions[kind]?.jobs[`${kind}-finance`];
      if (financial) { financial.defaultView = "settlements"; financial.nav = workflowNav.filter(n => ["settlements", "business-exceptions"].includes(n[0])); }
    }
    WorkflowUI.install({ state, navigate, render, pad: false });
    render();
  </script>
</body>
</html>
